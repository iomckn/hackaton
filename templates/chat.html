{% extends "base.html" %}
{% set active_page = "chat" %}
{% set title = "Chat - Mobility Copilot" %}

{% block content %}
<div class="row g-4">
  <div class="col-12">
    <div class="card shadow-soft">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Chat analytique</h1>
        <p class="text-muted mb-4">
          Pose une question (ex: “Quels secteurs ont une hausse de collisions quand il neige ?”)
        </p>

        <form id="chatForm" class="d-flex gap-2">
          <input id="questionInput" class="form-control form-control-lg" type="text"
                 placeholder="Écris ta question ici…" autocomplete="off" />
          <button class="btn btn-dark btn-lg" type="submit">Envoyer</button>
        </form>

        <hr class="my-4" />

        <div id="chatOutput" class="d-grid gap-3">
          <!-- Les réponses s’afficheront ici -->
          <div class="alert alert-secondary mb-0">
            Réponse: <span class="text-muted">en attente…</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // HTML prêt pour brancher une API plus tard.
  // Pour l’instant, on affiche juste un “mock” de réponse.
  const form = document.getElementById("chatForm");
  const input = document.getElementById("questionInput");
  const out = document.getElementById("chatOutput");

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    if (typeof s !== "string") s = JSON.stringify(s, null, 2);
    return s.replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[m]));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;

    out.innerHTML = `
      <div class="alert alert-info mb-0">Question: <strong>${escapeHtml(q)}</strong></div>
      <div class="alert alert-secondary mb-0">Réponse: <span class="text-muted">…</span></div>
    `;

    // brancher sur backend Flask
    const res = await fetch("/api/chat", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ question: q, scope: {} })});
    const data = await res.json();



    out.innerHTML = `
      <div class="card shadow-soft">
        <div class="card-body p-3">
          <div class="small text-muted mb-1">Question</div>
          <div class="fw-semibold">${escapeHtml(q)}</div>
        </div>
      </div>

      <div class="card shadow-soft">
        <div class="card-body p-3">
          <div class="small text-muted mb-1">Réponse</div>
          <div>${escapeHtml(data.answer_text)}</div>
        </div>
      </div>

      <div class="card shadow-soft">
        <div class="card-body p-3">
          <div class="small text-muted mb-1">Preuves / contexte</div>
          <div class="mono prelike">${escapeHtml(data.evidence)}</div>
        </div>
      </div>

      <div class="card shadow-soft">
        <div class="card-body p-3">
          <div class="small text-muted mb-1">Requête générée</div>
          <div class="mono prelike">${escapeHtml(data.generated_query)}</div>
        </div>
      </div>

      <div class="card shadow-soft">
        <div class="card-body p-3">
          <div class="small text-muted mb-1">Limites / à vérifier</div>
          <div class="mono prelike">${escapeHtml(data.limits_and_next_checks)}</div>
        </div>
      </div>
    `;
  });
</script>
{% endblock %}
