<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Mobility Copilot" }}</title>

  <!-- Bootstrap (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body { background: #f7f7f8; }
    .app-container { max-width: 1100px; }
    .card { border: 0; border-radius: 14px; }
    .shadow-soft { box-shadow: 0 6px 22px rgba(0,0,0,.06); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .prelike { white-space: pre-wrap; }
  </style>

  {% block head_extra %}{% endblock %}
</head>

<body>
  <!-- Bandeau de navigation (commun à toutes les pages) -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container app-container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('pages.chat_page') }}">Mobility Copilot</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="topNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if active_page=='chat' %}active fw-semibold{% endif %}"
               href="{{ url_for('pages.chat_page') }}">Chat</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_page=='briefing' %}active fw-semibold{% endif %}"
               href="{{ url_for('pages.briefing_page') }}">Synthèse</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_page=='dashboard' %}active fw-semibold{% endif %}"
               href="{{ url_for('pages.dashboard_page') }}">Tableau de bord</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container app-container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
